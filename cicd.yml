# cicd.yml — parametrización del CI/CD para el motor portable (nicolasbatistoni/cicd-toolkit).
# La lógica vive en el toolkit; este repo declara solo lo propio. Schema: README de cicd-toolkit.
name: hermes-anythingllm
workdir: .
security:
  fs_scan_ref: .
  severity: CRITICAL,HIGH
# ── paths-guard — la red que hace segura la allowlist de disparo (ver .woodpecker.yml) ──
# El disparo del CI es una allowlist, o sea fail-closed: si aparece código nuevo y nadie agrega su
# filtro, ese código no se testea nunca y el gate se saltea EN SILENCIO. `cicd paths-guard` cruza
# `git ls-files` contra los include: declarados y FALLA si algo quedó sin cubrir. Acá van los exentos:
# lo que no puede afectar a ningún artefacto ni test. (Docs, .gitignore y .githooks/** ya vienen por
# default en el motor.)
paths_guard:
  ignore:
    - '.github/**' # solo los assets de marca del README; no hay workflows en este repo
images:
  # Pineado por versión+digest (INV-2): security corre render-pipeline --check con ESTA imagen; con :latest el
  # motor que verifica cambia solo y el gate se rompe sin que nadie toque nada (medido 2026-08-29 en la flota).
  toolkit: ghcr.io/nicolasbatistoni/cicd-toolkit:0.96.0@sha256:a871cffd5e336bdb022ba5a8c1c15b0891de227f94508e8c1629728aee6e112a
release:
  artifact: none
# ── El pipeline se GENERA desde acá (`cicd render-pipeline`) ───────────────────────────────────────
# El `.woodpecker.yml` se deriva del cicd.yml. El gate `cicd render-pipeline --check` (step `security`)
# rompe el CI si alguien lo edita a mano. Allowlist de disparo (AGENTS §1.ter):
paths:
  - 'mcp/**'
  - 'scripts/**'
  - 'config/**'
  - 'install.sh'
  - 'install.ps1'
  - 'cicd.yml'
  - '.woodpecker.yml'
  - 'AGENTS.md'
pipeline:
  # Repo PÚBLICO: los minutos hosted son GRATIS en repos públicos, y el grupo de runners de la org no
  # admite públicos (allows_public_repositories: false). Gratis en GitHub > pagado en DO para este caso.
  runs_on: ubuntu-latest
